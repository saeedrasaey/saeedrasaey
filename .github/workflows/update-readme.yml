name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch: # manual run from the Actions tab
  push: # runs once automatically when this file changes
    branches: [main]
    paths: [".github/workflows/update-readme.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const login = "saeedrasaey";
            const to = new Date();
            const from = new Date(to.getTime() - 365 * 24 * 60 * 60 * 1000);
            const day = (d) => d.toISOString().slice(0, 10);

            // Default GITHUB_TOKEN cannot see private repos -> public data only.
            const { user } = await github.graphql(
              `query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  repositories(privacy: PUBLIC, ownerAffiliations: OWNER) { totalCount }
                  contributionsCollection(from: $from, to: $to) { totalCommitContributions }
                }
              }`,
              { login, from: from.toISOString(), to: to.toISOString() }
            );

            const repos = user.repositories.totalCount;
            const commits = user.contributionsCollection.totalCommitContributions;
            core.info(`Public repos: ${repos}`);
            core.info(`Commits ${day(from)} -> ${day(to)}: ${commits}`);

            const block = [
              "<!--STATS:START-->",
              `- 📦 **Public Repositories:** ${repos}`,
              `- 🔥 **Commits (Last 365 Days):** ${commits}  <sub>${day(from)} → ${day(to)}</sub>`,
              "",
              `<sub>Public repositories only · updated daily by GitHub Actions · last run: ${day(to)} (UTC)</sub>`,
              "<!--STATS:END-->",
            ].join("\n");

            const readme = fs.readFileSync("README.md", "utf8");
            const re = /<!--STATS:START-->[\s\S]*?<!--STATS:END-->/;
            if (!re.test(readme)) core.setFailed("STATS markers not found in README.md");
            fs.writeFileSync("README.md", readme.replace(re, block));

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README stats"
          git pull --rebase origin main
          git push
